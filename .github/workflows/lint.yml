name: CI

# Runs on pull requests (every target branch) and on pushes to master, i.e. merges.
# Plain pushes to feature branches do not trigger CI; open a PR to get checks.
on:
    push:
        branches: [master]
    pull_request:
        branches: ["**"]

# Least-privilege: this workflow only needs to read the checkout
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            # build only typechecks src/; test files are checked separately (#134)
            - run: npm run typecheck:test
            - run: npm test
            - run: npm run lint
