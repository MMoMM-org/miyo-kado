name: Release

on:
    push:
        branches: [master]

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build

            - run: npm test

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release

            - name: Guard against silently-dropped releases
              run: |
                  LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
                  RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
                  if git log "$RANGE" --format='%s' | grep -qE '^(feat|fix)(\(.+\))?!?:'; then
                    echo "::error::Release-worthy feat/fix commit(s) present since ${LAST_TAG:-<root>} but no release was cut — likely a commit-analyzer preset/config drop."
                    git log "$RANGE" --format='  %s' | grep -E '^  (feat|fix)(\(.+\))?!?:'
                    exit 1
                  fi
                  echo "Release guard OK."

            - name: Attest release artifacts
              if: success() && hashFiles('build/main.js', 'build/styles.css') != ''
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: |
                      build/main.js
                      build/styles.css
